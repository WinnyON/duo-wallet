name: Duo Wallet CI & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Run unit & widget tests
        run: flutter test

  build-release-apk:
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      - name: Build signed release APK
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=RELEASE_MANIFEST_URL=${{ secrets.SUPABASE_URL }}/storage/v1/object/public/releases/latest.json

      - name: Generate latest.json manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/releases/duo-wallet-${GITHUB_REF_NAME}.apk"
          cat <<EOF > build/app/outputs/flutter-apk/latest.json
          {
            "version": "${VERSION}",
            "tag": "${GITHUB_REF_NAME}",
            "apk_url": "${APK_URL}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload APK and latest.json to Supabase Storage
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          curl -fsSL -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/releases/duo-wallet-${GITHUB_REF_NAME}.apk" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary @build/app/outputs/flutter-apk/app-release.apk

          curl -fsSL -X POST \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/releases/latest.json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @build/app/outputs/flutter-apk/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/latest.json
